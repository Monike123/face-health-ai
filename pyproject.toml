[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facehealth"
version = "0.1.0"
description = "Contactless rPPG wellness vital-sign estimation from face video"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "FaceHealth" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "opencv-python>=4.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.3",
  "mypy>=1.8",
  "types-PyYAML",
]
ml = [
  "torch>=2.2",
  "onnxruntime>=1.17",
  "mediapipe>=0.10",
]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "clerk-backend-api>=1.0",
  "httpx>=0.27",
]

[project.scripts]
facehealth = "facehealth.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["facehealth"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "mediapipe", "mediapipe.*", "scipy", "scipy.*"]
ignore_missing_imports = true
